  <!-- Suppress console errors -->
  <script>
    const originalError = console.error;
    const originalWarn = console.warn;

    console.error = function (...args) {
      const errorMsg = args.join(' ');
      if (
        errorMsg.includes('Failed to load resource') ||
        errorMsg.includes('text-l-') ||
        errorMsg.includes('favicon.ico') ||
        errorMsg.includes('missing property') ||         // Spline runtime error
        errorMsg.includes('Missing property') ||         // Spline runtime error
        errorMsg.includes('GL_INVALID') ||               // WebGL errors from Spline
        errorMsg.includes('WebGL') ||                    // WebGL warnings
        errorMsg.includes('Framebuffer') ||              // Framebuffer errors
        errorMsg.includes('glDraw') ||                   // OpenGL draw errors
        errorMsg.includes('glClear') ||                  // OpenGL clear errors
        errorMsg.includes('glTexStorage') ||             // Texture errors
        errorMsg.includes('ignore-listed frames') ||
        errorMsg.includes('0dff') ||
        errorMsg.includes('Show ignore-listed frames') ||
        errorMsg.includes('react-dom') ||
        errorMsg.includes('scheduler')
      ) {
        return;
      }
      originalError.apply(console, args);
    };

    console.warn = function (...args) {
      const warnMsg = args.join(' ');
      // Suppress known warnings (add your new one here)
      if (
        warnMsg.includes('A component is changing') ||
        warnMsg.includes('defaultValue') ||
        warnMsg.includes('uncontrolled') ||
        warnMsg.includes('updating from  ') ||              // catches "updating from  118 to  119"
        warnMsg.includes('Your .splinecode file is more recent') || // hide Spline version warning
        warnMsg.includes('passive event listener') ||       // Spline passive listener warning
        warnMsg.includes('apple-mobile-web-app-capable') || // Apple meta tag deprecation
        warnMsg.includes('width(-1)') ||                    // Recharts dimension warnings
        warnMsg.includes('height(-1)') ||                   // Recharts dimension warnings
        warnMsg.includes('React Router Future Flag') ||     // React Router v7 migration warnings
        warnMsg.includes('v7_startTransition') ||           // React Router future flag
        warnMsg.includes('v7_relativeSplatPath') ||         // React Router future flag
        warnMsg.includes('requestAnimationFrame') ||        // Performance warnings from Spline
        warnMsg.includes('Violation') ||                    // All violation warnings (mostly Spline)
        warnMsg.includes('scroll-blocking')                 // Scroll-blocking event warnings
      ) {
        return;
      }
      originalWarn.apply(console, args);
    };
  </script>
